<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FireTV Fernbedienung</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      font-family: sans-serif;
      min-height: 100vh;
    }

    h1 {
      color: #e0e0e0;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .remote {
      background: #16213e;
      border-radius: 32px;
      padding: 28px 24px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    /* Genereller Button-Stil */
    button {
      background: #0f3460;
      color: #e0e0e0;
      border: none;
      border-radius: 10px;
      padding: 12px 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }
    button:active {
      background: #e94560;
      transform: scale(0.94);
    }

    /* Navigationskreuz */
    .dpad {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      gap: 6px;
      aspect-ratio: 1;
    }
    .dpad .up    { grid-column: 2; grid-row: 1; }
    .dpad .left  { grid-column: 1; grid-row: 2; }
    .dpad .ok    { grid-column: 2; grid-row: 2; background: #e94560; border-radius: 50%; font-weight: bold; }
    .dpad .right { grid-column: 3; grid-row: 2; }
    .dpad .down  { grid-column: 2; grid-row: 3; }

    /* Dreier-Reihen */
    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    /* Zweier-Reihen */
    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Volle Breite */
    .full {
      width: 100%;
    }

    /* App-Buttons bekommen eigene Farbe */
    .app-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .app-row button {
      background: #1a1a4e;
      font-size: 0.8rem;
    }

    /* Status-Anzeige */
    #status {
      margin-top: 16px;
      font-size: 0.75rem;
      color: #888;
      height: 1.2em;
      text-align: center;
    }
    #status.ok  { color: #4caf50; }
    #status.err { color: #e94560; }
  </style>
</head>
<body>
  <h1>FireTV Fernbedienung</h1>

  <div class="remote">

    <!-- Systemtasten -->
    <div class="row3">
      <button onclick="send(4)">&#8592; Zurück</button>
      <button onclick="send(3)">&#8962; Home</button>
      <button onclick="send(82)">&#9776; Menü</button>
    </div>

    <!-- Navigationskreuz -->
    <div class="dpad">
      <button class="up"    onclick="send(19)">&#9650;</button>
      <button class="left"  onclick="send(21)">&#9664;</button>
      <button class="ok"    onclick="send(23)">OK</button>
      <button class="right" onclick="send(22)">&#9654;</button>
      <button class="down"  onclick="send(20)">&#9660;</button>
    </div>

    <!-- Transport -->
    <div class="row3">
      <button onclick="send(89)">&#9664;&#9664;</button>
      <button onclick="send(85)">&#9654;&#9646;&#9646;</button>
      <button onclick="send(90)">&#9654;&#9654;</button>
    </div>

    <!-- Lautstärke -->
    <div class="row3">
      <button onclick="send(164)">&#128263; Mute</button>
      <button onclick="send(25)">&#128264; Leiser</button>
      <button onclick="send(24)">&#128266; Lauter</button>
    </div>

    <!-- TV-Eingang -->
    <button class="full" onclick="send(178)">&#128television; Fernseher (TV Input)</button>

    <!-- Streaming-Apps -->
    <div class="app-row">
      <button onclick="launch('prime')">&#9654; Prime</button>
      <button onclick="launch('netflix')">&#127909; Netflix</button>
      <button onclick="launch('music')">&#127925; Amazon Music</button>
      <button onclick="launch('disney')">&#10024; Disney+</button>
    </div>

  </div>

  <div id="status"></div>

  <script>
    // Token aus URL-Parameter lesen und sofort aus dem Browserverlauf entfernen
    const params = new URLSearchParams(window.location.search);
    const authToken = params.get('firetvauth') || sessionStorage.getItem('firetvauth') || '';
    if (authToken) {
      sessionStorage.setItem('firetvauth', authToken);
      params.delete('firetvauth');
      const cleanUrl = window.location.pathname + (params.size ? '?' + params : '');
      history.replaceState(null, '', cleanUrl);
    } else {
      document.body.innerHTML = '<p style="color:#e94560;font-family:sans-serif;text-align:center;margin-top:20vh">Kein Authentifizierungstoken angegeben.<br>Bitte URL mit <code>?firetvauth=...</code> aufrufen.</p>';
    }

    function authHeaders() {
      return {
        'Content-Type': 'application/json',
        ...(authToken ? { 'X-FireTV-Auth': authToken } : {}),
      };
    }

    const status = document.getElementById('status');

    function showStatus(ok, text) {
      status.textContent = text;
      status.className = ok ? 'ok' : 'err';
      setTimeout(() => { status.textContent = ''; status.className = ''; }, 2000);
    }

    async function send(keycode) {
      try {
        const res = await fetch('/keyevent', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ keycode }),
        });
        const data = await res.json();
        showStatus(data.ok, data.ok ? 'OK' : 'Fehler: ' + data.stderr);
      } catch (e) {
        showStatus(false, 'Verbindungsfehler');
      }
    }

    async function launch(app) {
      try {
        const res = await fetch('/keyevent', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ app }),
        });
        const data = await res.json();
        showStatus(data.ok, data.ok ? 'App gestartet' : 'Fehler: ' + data.stderr);
      } catch (e) {
        showStatus(false, 'Verbindungsfehler');
      }
    }
  </script>
</body>
</html>
